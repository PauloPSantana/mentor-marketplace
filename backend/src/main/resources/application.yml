spring:
  application:
    name: mentorhub-api
  datasource:
    url: jdbc:h2:file:./data/mentorhub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

mentorhub:
  security:
    jwt:
      secret: ${JWT_SECRET:mentorhub-dev-secret-change-me-in-production-32bytes-min}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  sessions:
    max-duration-minutes: 240
    complete-grace-minutes: 15
    reminder-interval-ms: 60000
  payments:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:mentorhub-dev-webhook-secret}
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
    redirect-uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/v1/auth/linkedin/callback}
    frontend-redirect: ${LINKEDIN_FRONTEND_REDIRECT:http://localhost:3000/cadastro}
  uploads:
    dir: ${UPLOADS_DIR:./data/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.mentorhub: INFO
    org.springframework.security: WARN
